name: Update demo

permissions: {}

on:
  workflow_dispatch:

jobs:
  update-demo:
    name: Update Demo
    timeout-minutes: 10
    permissions:
      contents: write # needed to commit regenerated demo artifacts
      pull-requests: write # needed to open the update pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - run: vhs < ./tapes/demo.tape
      - run: vhs < ./tapes/gess.tape

      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "chore: Update demo"
          body: ${{ github.sha }}
          branch: docs/update
          branch-suffix: short-commit-hash
